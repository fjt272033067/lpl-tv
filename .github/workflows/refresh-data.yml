# =====================================================================
# 自动重建赛事数据并推回仓库
#
# 为什么需要这个工作流：
#   赛程 / 录像目录 / B 站直播流地址这三份数据，上游接口都没有跨域头 ——
#   腾讯的全量对阵表是裸 JSON（B 站流地址接口不给 ACAO、JSONP 被 ORB 拦死），
#   浏览器运行时读不到，只能构建期抓。所以要「赛程每天自动更新」，
#   必须有一个会自己跑的构建环境；桌面手动烘焙做不到。
#
# 站点侧已经准备好远端数据源（index.html 的 <meta name="lpl-tv-data-base">）：
#   它把本地快照与远端两份都读回来，按 updatedAt 取更新的那份。
#   于是本工作流只要把 site/data 提交到仓库，站点就会自动拿到新数据，
#   **不需要重新部署站点**。
#
# 前提：
#   1. 仓库必须是公开仓库（站点要匿名读取 CDN 上的 JSON）；
#   2. 站点部署一次，并把 <meta name="lpl-tv-data-base"> 指向本仓库的 data 目录，
#      例如 https://raw.githubusercontent.com/<owner>/<repo>/main/site/data
#
# 关于选哪个 CDN（实测 2026-10-29）：
#   · raw.githubusercontent.com —— Cache-Control: max-age=300（5 分钟）+ ACAO: *，适合这种
#     20 分钟一次的数据更新；
#   · cdn.jsdelivr.net —— s-maxage=43200（**12 小时** CDN 缓存）！分支 URL 下的文件
#     会被缓存半天，看起来就像「数据没更新」。除非用 commit SHA 做版本号，否则别用。
#
# 关于仓库体积：
#   bake.mjs 只在「内容真的变了」时才更新 schedule/catalog 的 updatedAt，
#   所以每轮提交只有 version.json（几百字节）+ liverooms.json（8KB），
#   仓库不会每 20 分钟膨胀一次。
# =====================================================================
name: refresh-data

on:
  schedule:
    # 每 20 分钟一次。B 站直播流地址有效期约 60 分钟，必须在过期前重签；
    # 赛程 / 录像目录跟着一起刷新。
    #
    # 分钟数用 11/31/51（错开整点与半点）：整点是 GitHub 调度最拥堵的时刻，
    # 高峰期定时任务会被延迟甚至整段丢弃。
    #
    # ⚠️⚠️ 改了这段 cron 必须「推上去」才能让 GitHub 重新注册调度。
    #
    # 这个坑真的踩过（实测 2026-10-30）：仓库建好后 event=schedule 的 run 一条都没有，
    # 而 workflow 明明是 active、workflow_dispatch 手动也能跑、push 触发器照常触发。
    #
    # ⚠️ 排查结论（已核实，别再走一遍错路）：
    #   · 提交者身份确实是个坑 —— 本仓库 git 邮箱填的是 fangchen@localhost，
    #     这个地址在 GitHub 上没有对应账号，提交在 API 里顶层 author/committer 全是 null。
    #     已改成可归属的 noreply 邮箱（身份该改还是要改，这本身是最佳实践）。
    #   · 但「调度绑定到改 cron 那次提交的身份」这条机制**并不存在**（官方文档无此规则），
    #     而且**改完身份 + 改完 cron 之后，schedule run 依然一条都没有**。
    #   · 判决手段是加一个最小探针工作流（cron '*/5 * * * *'）：探针也没有 schedule run
    #     → 说明是**仓库/账号层面的调度没注册**，不是本文件写错了。
    #     同一时刻对照组 github/docs 有 2500 条 schedule run，平台是健康的。
    #
    # → 结论：这条 cron 保留着（万一 GitHub 哪天恢复调度就自动能用），
    #   但**不要指望它**。真正的定时更新走外部调度器打 dispatch 接口：
    #     POST /repos/<owner>/<repo>/actions/workflows/refresh-data.yml/dispatches
    #     Authorization: Bearer <fine-grained PAT>
    #     {"ref":"main"}
    #   详见 docs/新建仓库并推送.md §2.7，触发脚本：tools/dispatch-refresh.mjs
    #
    # 分钟数用 11/31/51（错开整点与半点）：整点是 GitHub 调度最拥堵的时刻，
    # 高峰期定时任务会被延迟甚至整段丢弃。
    - cron: '11,31,51 * * * *'
  # 外部调度器（如 uptime-kuma / cron-job.org）也可以用 PAT 打这个事件来触发，
  # 作为 GitHub 自带 cron 不准时的备用通道。
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:
    inputs:
      vods:
        description: '抓取的录像条数（增量模式下只处理新增比赛）'
        default: '160'
  # 代码改了也跟着重烘焙一次（改的是脚本/配置时，本地快照可能已经过时）。
  # 用 paths-ignore 排除 site/data/**：本工作流自己只提交 site/data，
  # 所以它触发的提交不会再次触发本工作流 —— 不会自激循环。
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'

permissions:
  contents: write   # 提交数据
  actions: write    # 链式续命要派发 workflow_dispatch

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 增量烘焙依赖上一次的产物（沿用 B 站录像映射、弹幕缓存）
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 注意：不要跑 npm ci。烘焙只用 Node 内置模块，playwright 只有验收才需要，
      # 装它会白白多花几分钟。

      - name: 重建数据（赛程 / 录像 / 弹幕 / 直播间）
        run: |
          set -o pipefail
          node tools/bake.mjs --vods=${{ github.event.inputs.vods || '160' }} 2>&1 | tee bake.out.txt

      - name: 提交数据
        run: |
          set -o pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "数据无实质变化，跳过提交"
          else
            git commit -m "data: 刷新赛事数据快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 记下这一轮烘焙出来的提交（只碰 site/data）。
            BAKE_COMMIT="$(git rev-parse HEAD)"
            #
            # 期间如果有人推了新提交（上一轮的 CI、或者别人改了仓库），
            # 我们的 HEAD 就落后于 origin/main 了。
            #
            # ⚠️ 这里踩过一个坑（实测 2026-10-30）：原来的写法是
            #     git pull --rebase origin main || true
            #     git push
            # 「|| true」把 rebase 失败吞掉了，于是：
            #   ① rebase 冲突 → 仓库停在「rebase 中」状态、HEAD 变成游离态；
            #   ② 随后的 git push 报 "fatal: You are not currently on a branch"
            #      → 退出码 128 → 整个 job 失败；
            #   ③ 而 `|| true` 让前面那句看着像成功了，日志里毫无线索。
            #
            # 只动 site/data 的机器产物，冲突概率其实很高（version.json 每次都变）。
            # 现在的做法：**不用 rebase**，改成「回到远端最新 + 只把我们的数据文件搬过去」——
            # 这一轮只碰 site/data，把它们精确取回来再在远端最新 main 上重新提交，
            # 天然不会冲突，也不需要 rebase。
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            # 只取回这一轮烘焙出来的数据（origin/main 上别人加的其它文件保持不动）
            git checkout "$BAKE_COMMIT" -- site/data
            git add site/data
            if git diff --staged --quiet; then
              echo "远端已有同样内容，跳过提交"
            else
              git commit -m "data: 刷新赛事数据快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push origin "HEAD:${{ github.ref_name }}"
              echo "已提交，站点下次轮询（约 5 分钟内）自动取到新数据"
            fi
          fi

      # ============================================================
      # 链式续命：让「每 20 分钟刷新一次」不再依赖 GitHub 自带 cron 准不准
      # ============================================================
      # 实测（2026-10-30 → 11-01，共 27 小时）：
      #   GitHub 自带的 schedule **会跑，但极其稀疏** —— cron 写的是每 20 分钟
      #   （11,31,51），实测只跑了 11 次，平均 3~7 小时才一轮，而且 11 次全部
      #   success（不是配置错、不是被拒、不是平台故障）。
      #   结果就是「每 20 分钟刷新」这个设计意图没兑现：
      #   B 站流地址约 60 分钟过期，这一层经常拿到的已经是过期地址。
      #
      # 解法：工作流跑完**自己派生下一个自己**。
      #   GITHUB_TOKEN 触发 workflow_dispatch 是官方允许的例外
      #   （「GITHUB_TOKEN 触发的事件不会创建新 run」只针对 push 等事件，
      #     workflow_dispatch / repository_dispatch 属于例外）。
      #   每轮结束前 sleep 18 分钟再派生下一轮 → 稳定 ~20 分钟一轮。
      #
      # ⚠️ 护栏（别去掉，否则 CI 用量会翻倍）：
      #   ① 派生前先看有没有别的 run 在跑/在排队 —— cron 也会触发本工作流，
      #      有别人在跑就跳过派生，保证任何时刻只有一条链；
      #   ② 上面的 cron 保留着当兜底：链断掉时 cron 能把链重新拉起来；
      #   ③ 想彻底停掉续命：删掉下面这两个步骤即可（数据会退回到 cron 的稀疏节奏）。
      - name: 等待下一个刷新窗口
        if: always()
        run: sleep 1080

      - name: 派生下一轮（链式续命）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: refresh-data.yml
        run: |
          # ① 护栏：已有别的 run 在跑/在排队 → 说明 cron 也派生了一条，别叠第二条链
          N=$(gh run list --workflow "$WORKFLOW" --limit 8 --json status \
              --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          echo "在跑/排队的 run 数：$N（含本轮）"
          if [ "$N" -gt 1 ]; then
            echo "已有其它 run，跳过派生（避免两条链并行）"
            exit 0
          fi
          # ② 派生下一轮
          gh workflow run "$WORKFLOW" --ref "${GITHUB_REF_NAME}"
          echo "已派生下一轮，约 20 分钟后继续"

      - name: 失败时保留日志
        if: failure()
        run: tail -n 120 bake.out.txt 2>/dev/null || true
