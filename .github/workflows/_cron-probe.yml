# =====================================================================
# cron-probe —— **临时诊断用**，用来把两种可能性分开：
#   A. 本仓库的定时调度整体没被注册（仓库/账号层面）
#   B. 只有 refresh-data.yml 这个文件没被注册
#
# 判读：把本文件推上去后，看 event=schedule 的 run 里有没有出现 cron-probe。
#   · 出现了        → 调度是通的，问题在 refresh-data.yml 本身
#   · 没出现        → 仓库层面的调度没注册，需要换触发通道
#
# 结论确定后**删掉这个文件**（它会每 5 分钟白烧一次 runner）。
# =====================================================================
name: cron-probe
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "cron-probe ran at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
