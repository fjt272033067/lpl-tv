    <title>LPL-TV · 英雄联盟赛事高清直播与录像</title>
    <meta

      content="LPL-TV：英雄联盟赛事高清直播与录像站。支持超清/高清多档清晰度切换、倍速播放、B站弹幕同步显示，支持看直播与看录播。"
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="referrer" content="no-referrer" />
    <!--
      可选：远端数据源基址（留空 = 只用本地烘焙快照，行为不变）。
      填成「含 schedule.json / catalog.json / liverooms.json 的目录」后，站点会把本地与
      远端两份都读回来并按 updatedAt 取更新的那份 —— 于是 CI 每次重建只要把 site/data
      提交到公开仓库，赛程与直播源就能日更，不必重新部署站点本身。

      ⚠️ 为什么要「镜像」列表（实测 2026-10-30，本机浏览器）：
        raw.githubusercontent.com 在大陆经常连不上（本机 Chrome 直接 fetch 8ms 就
        "Failed to fetch"，而走系统代理的 PowerShell 却能通 —— 浏览器不继承那套代理）。
        只押一个源 = 用户的浏览器一旦拿不到远端，就只能一直用部署时的本地快照，
        于是出现「CI 明明更新了数据、页面却还是旧的」这种静默失败。
        站点会并发探测这些镜像，并**按内容时间戳挑最新的那份**（先到的不一定最新）。

      镜像的缓存策略差一个数量级，所以站点还按文件设了「陈旧上限」：
        raw.githubusercontent.com → 5 分钟
        gh-proxy.com             → 60 秒（带 ACAO: *，大陆可直连，实测能拿到最新内容）
        jsDelivr 家族            → 12 小时（实测：仓库提交 34 分钟后它还在吐旧版本）
      liverooms（B 站流地址约 60 分钟过期）超过 2 小时就不采用远端那份，
      避免出现「页面看着有内容、播放器却是黑的」。
    -->
    <meta name="lpl-tv-data-base" content="https://raw.githubusercontent.com/fjt272033067/lpl-tv/main/site/data" />
    <meta
      name="lpl-tv-data-mirrors"
      content="https://gh-proxy.com/https://raw.githubusercontent.com/fjt272033067/lpl-tv/main/site/data, https://gcore.jsdelivr.net/gh/fjt272033067/lpl-tv@main/site/data, https://cdn.jsdelivr.net/gh/fjt272033067/lpl-tv@main/site/data"
    />
